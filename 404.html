<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Tidak Ditemukan - MDTA Shirotul Jannah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .error-container {
            max-width: 500px;
        }
        .error-container i {
            font-size: 5rem;
            color: #c9a84c;
            margin-bottom: 16px;
        }
        .error-container h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #065a2a;
        }
        .error-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e2a3a;
            margin: 8px 0 16px;
        }
        .error-container p {
            color: #4a5a6a;
            margin-bottom: 24px;
        }
        .btn-primary {
            background: #0a7e3b;
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s ease;
        }
        .btn-primary:hover {
            background: #065a2a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-mosque"></i>
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.</p>
        <a href="/" class="btn-primary"><i class="fas fa-home"></i> Kembali ke Beranda</a>
    </div>
</body>
</html>
